# ─────────────────────────────────────────────────────────────────────────
# Build the api + web Docker images and publish them to the GitHub
# Container Registry (ghcr.io). The VPS pulls these images — it never
# builds. See docker-compose.prod.yml.
#
# Images published (owner is lowercased automatically):
#   ghcr.io/<owner>/peerahat-api:{latest,<sha>}
#   ghcr.io/<owner>/peerahat-web:{latest,<sha>}
#
# Build strategy: api and web run as two PARALLEL jobs on separate
# runners. Wall time = max(api, web) instead of api + web — typical run
# drops from 12–16 min to 6–8 min. Each job pushes its image
# independently; if one fails the other still publishes.
#
# No secrets to configure — the built-in GITHUB_TOKEN has packages:write.
# ─────────────────────────────────────────────────────────────────────────
name: Build & publish images

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Avoid stacking multiple builds for the same branch — cancel any in-
# progress run when a new commit lands. Saves runner minutes when
# pushing several commits in quick succession.
concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── API image ─────────────────────────────────────────────────────────
  publish-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ghcr.io image paths must be lowercase; the owner login may not be.
      - name: Resolve image prefix
        id: prefix
        run: >-
          echo "value=ghcr.io/$(echo '${{ github.repository_owner }}'
          | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.prefix.outputs.value }}/peerahat-api:latest
            ${{ steps.prefix.outputs.value }}/peerahat-api:${{ github.sha }}
          # Per-image cache scope so api + web don't fight for the same
          # GHA cache budget (10 GB/repo, oldest evicted first).
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  # ─── Web image ─────────────────────────────────────────────────────────
  publish-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image prefix
        id: prefix
        run: >-
          echo "value=ghcr.io/$(echo '${{ github.repository_owner }}'
          | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # ── Persist the Next.js build cache across CI runs ────────────────────
      # `cache-to/from: type=gha` caches image *layers*, but NOT BuildKit
      # cache *mounts*. The web image's `RUN --mount=type=cache,
      # target=.../.next/cache` is therefore cold on every run: any source
      # edit invalidates `COPY . .`, so the `next build` layer re-executes.
      # buildkit-cache-dance round-trips .next/cache through actions/cache so
      # that rebuild stays incremental run-to-run.
      #
      # The pnpm-store mount is deliberately NOT danced: when package.json
      # and the lockfile are unchanged the whole install layer is a plain
      # `type=gha` hit, so a warm store buys nothing — and dancing a ~1 GB
      # dir every run would cost more than it saves.
      #
      # Cache key includes lockfile hash so a dependency change starts a
      # fresh cache lineage instead of restoring stale module artifacts
      # that next would have to re-transform anyway.
      - name: Restore Next.js build cache
        id: next-cache
        uses: actions/cache@v4
        with:
          path: .ci-cache/next-cache
          key: next-build-cache-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-build-cache-${{ hashFiles('pnpm-lock.yaml') }}-
            next-build-cache-

      # Injects .ci-cache/next-cache into the BuildKit cache mount before the
      # web build; the action's post-step extracts the updated mount back out
      # so actions/cache can save it. Placed AFTER the actions/cache step so
      # the post-steps run in the correct order: extract, then save.
      - name: Sync Next.js cache into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          cache-map: |
            {
              ".ci-cache/next-cache": "/app/apps/web/.next/cache"
            }
          skip-extraction: ${{ steps.next-cache.outputs.cache-hit }}

      # NEXT_PUBLIC_* are baked into the browser bundle at build time, so
      # they must be passed here. These are PUBLIC values (they ship to the
      # client) — not secrets. Edit them when the environment changes
      # (e.g. swapping the VPS IP for a real domain), then re-run.
      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ steps.prefix.outputs.value }}/peerahat-web:latest
            ${{ steps.prefix.outputs.value }}/peerahat-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://peerahat.com/api
            NEXT_PUBLIC_SITE_URL=https://peerahat.com
            NEXT_PUBLIC_SUPABASE_URL=https://fuuvxzgeugrkxycyalxc.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_h2qARSVvS6v7qf8BOvRxHw_6Sc_q-fN
            NEXT_PUBLIC_SUPABASE_GOOGLE_ENABLED=true
            NEXT_PUBLIC_BOOKING_DAY_START_HOUR=9
            NEXT_PUBLIC_BOOKING_DAY_END_HOUR=21
